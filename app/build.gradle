plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usama.echo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.usama.echo'
        minSdk 24
        targetSdk 34
        def buildNumber = (project.findProperty('buildNumber') ?: '1').toString().toInteger()
        versionCode buildNumber
        versionName "build " + buildNumber
    }

    // Fixed signing key, so every new build installs over the old one and keeps your music.
    signingConfigs {
        debug {
            storeFile file('echo.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/*.kotlin_module', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        // Lets the YouTube download library run on Android 7–7.1 too
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    // Reads YouTube video details so Echo can download audio or video
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
