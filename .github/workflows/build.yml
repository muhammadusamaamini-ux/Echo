name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log

      - name: Save the build log if it failed (so Claude can read it)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-build-${{ github.run_number }}
          name: Failed build ${{ github.run_number }} (log only)
          body: This build failed. The log is attached. Not an app update.
          files: build.log
          prerelease: true
          make_latest: false

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Echo.apk

      - name: Write "What's new" from the commit message
        run: git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md

      - name: Publish to Releases (download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Echo (build ${{ github.run_number }})
          body_path: notes.md
          files: Echo.apk
          make_latest: true
